name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  server-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix server ci
      - run: npm --prefix server test
      - run: node tools/build-server-installer.js
      - uses: actions/upload-artifact@v4
        with:
          name: server-installer
          path: dist/pz-control-server-installer.sh

  client-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix client ci
      - run: npm --prefix client run dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-installer
          path: dist/client/pz-control-client-setup-*.exe

  publish:
    needs: [server-installer, client-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
